# Amazon entries: orders ship to Austria, so every Amazon URL must be a listing
# Amazon delivers there. The scraper prices pages with the delivery location set
# to Austria and reports undeliverable listings as out of stock — check a new
# ASIN returns a price before adding it (a parent ASIN with no buy box, or one
# with a price but "kann nicht an den ausgewählten Lieferort versendet werden",
# is the wrong link; pick a size/colour child ASIN that ships).
# Shoes are tracked only in the wearer's sizes: a store carrying every size
# but these is out of stock for us, and no drop there is reported. A store's
# own label is matched, so each system is listed separately — cm where a
# store prints it (Sportvision), US on Amazon.com, EU everywhere else. Brands
# print different EU numbers for the same foot, hence the per-brand rows
# (from each brand's own chart; Sportvision's cm column confirms them).
sizes:
  cm: ['28.5', '29']
  us: ['10.5', '11']
  eu:
    default: ['44.5', '45']
    adidas: ['44 2/3', '45 1/3']
    hoka: ['44 2/3', '45 1/3']
    puma: ['44', '44.5']
    mizuno: ['44', '44.5']

