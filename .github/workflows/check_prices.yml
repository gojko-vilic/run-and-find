name: Check Prices

on:
  schedule:
    - cron: '0 8 * * *' # every day at 08:00 UTC
  workflow_dispatch: # manual "Run workflow" button in Actions tab

permissions:
  contents: write # needed to commit last_prices.json back to repo

# A second run racing the first can only fight over last_prices.json
concurrency:
  group: check-prices
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run price checker
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python checker.py

      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="${GITHUB_REF_NAME:-$(git rev-parse --abbrev-ref HEAD)}"
          # The checker regenerates last_prices.json in full, so the copy we
          # just produced always wins. Rebasing it against the remote can only
          # manufacture conflicts and strand the runner mid-rebase, so sync to
          # the remote tip and re-apply our copy on top instead.
          cp data/last_prices.json "${RUNNER_TEMP:-/tmp}/last_prices.json"
          git fetch --quiet origin "$BRANCH"
          git reset --quiet --hard "origin/$BRANCH"
          cp "${RUNNER_TEMP:-/tmp}/last_prices.json" data/last_prices.json
          git add data/last_prices.json
          if git diff --staged --quiet; then
            echo "No price changes to commit"
            exit 0
          fi
          git commit -m "chore: update last prices [skip ci]"
          git push
